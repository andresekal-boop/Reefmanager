<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meerwasser-Logbuch</title>
<style>
:root{--bg:#f2f7f9;--card:#fff;--tx:#12303d;--mu:#5b7783;--ac:#0a7ea4;--ok:#1b9e5a;--wa:#d99a00;--er:#d64545;--bd:#d6e2e8}
@media(prefers-color-scheme:dark){:root{--bg:#0a1920;--card:#12262f;--tx:#e3f0f5;--mu:#8fadba;--ac:#3cb8e0;--bd:#23404c}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--ac);color:#fff;padding:14px 16px;font-size:18px;font-weight:600}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav button{border:0;background:none;color:var(--mu);padding:8px 12px;border-radius:8px;font:inherit;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--ac);color:#fff}
main{max-width:900px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:17px}.mu{color:var(--mu);font-size:13px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
label{display:block;font-size:12px;color:var(--mu)}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button.b{background:var(--ac);color:#fff;border:0;padding:9px 14px;border-radius:8px;font:inherit;cursor:pointer;margin-top:10px}
button.s{background:none;border:1px solid var(--bd);color:var(--tx);padding:4px 9px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;color:#fff}
.c0{background:var(--ok)}.c1{background:var(--wa)}.c2{background:var(--er)}
.t{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.v{border-left:4px solid;padding:8px 10px;border-radius:8px;background:var(--bg)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.x0{color:var(--ok)}.x1{color:var(--wa)}.x2{color:var(--er)}
svg text{fill:var(--mu);font-size:11px}
body{background:linear-gradient(180deg,var(--bg),#bfe9f3) fixed}
@media(prefers-color-scheme:dark){body{background:linear-gradient(180deg,#06222e,#0a3a4d) fixed}}
header{background:linear-gradient(120deg,#0a8fb8,#1f5fd1 60%,#7b3fe4);font-size:21px;padding:18px 16px}
.card{border-top:4px solid var(--ac);box-shadow:0 2px 8px rgba(10,120,160,.12)}
.card:nth-of-type(3n+2){border-top-color:#ff6b57}.card:nth-of-type(3n){border-top-color:#2fd0c4}
nav button.on{background:linear-gradient(120deg,#0a8fb8,#1f5fd1)}
button.b{background:linear-gradient(120deg,#ff7a59,#ff4f7b)}
.v{background:linear-gradient(135deg,var(--card),var(--bg))}
.pic{display:inline-flex;flex:none;background:linear-gradient(180deg,#c9f0f8,#4fb9dd);border-radius:12px;padding:4px}
@media print{header,nav,button,select{display:none!important}body{background:#fff}.card{box-shadow:none}}
input,select,textarea{font-size:16px;padding:11px 12px;border-radius:12px}
body{font-size:16px;line-height:1.5}
.card{border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(10,120,160,.10)}
button.s{padding:8px 12px;border-radius:10px;min-height:36px}
button.b{border-radius:12px;padding:12px 18px;font-weight:600}
header{position:sticky;top:0;z-index:6;border-radius:0 0 18px 18px}
main{padding:14px 12px 100px}footer{padding-bottom:100px!important}
nav{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;display:flex;justify-content:space-around;gap:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);border-bottom:0;overflow:visible;box-shadow:0 -4px 16px rgba(10,120,160,.12)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 2px;border-radius:12px;background:none;min-width:0}
nav button.on{background:none;color:var(--ac);font-weight:700}
.q{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 10px;text-align:center;color:var(--tx);font:inherit;font-size:14px;cursor:pointer;line-height:1.3}
.q:active{transform:scale(.98)}
</style></head><body>
<header>🐠 Meerwasser-Logbuch<div style="font-size:13px;font-weight:400;opacity:.9">Dein Riffaquarium im Blick · App von André Sekal 🪸🐟</div></header>
<nav id="nav"></nav><main id="m"></main><footer style="text-align:center;padding:16px;font-size:13px;color:var(--mu)">Meerwasser-Logbuch · Entwickelt von André Sekal</footer>
<script>
const P=[
{k:'temp',n:'Temperatur',u:'°C',a:24,b:26,s:.1},
{k:'sal',n:'Salinität',u:'ppt',a:34,b:36,s:.1},
{k:'ph',n:'pH-Wert',u:'',a:8,b:8.4,s:.01},
{k:'kh',n:'Karbonathärte',u:'dKH',a:7,b:9,s:.1},
{k:'ca',n:'Calcium',u:'mg/l',a:400,b:450,s:1},
{k:'mg',n:'Magnesium',u:'mg/l',a:1250,b:1350,s:1},
{k:'no3',n:'Nitrat',u:'mg/l',a:2,b:10,s:.1},
{k:'po4',n:'Phosphat',u:'mg/l',a:.01,b:.05,s:.01},
{k:'no2',n:'Nitrit',u:'mg/l',a:0,b:.05,s:.01},
{k:'nh4',n:'Ammonium',u:'mg/l',a:0,b:.05,s:.01}];
const H={temp:['Heizer und Raumtemperatur prüfen','Lüfter/Kühlung prüfen, Beleuchtungsdauer kürzen'],
sal:['Salzgehalt langsam anheben (Salzwasser statt Osmosewasser nachfüllen)','Mit Osmosewasser auffüllen, Verdunstung ausgleichen'],
ph:['Lüftung/CO₂ im Raum und KH prüfen','Kalkwasser-Dosierung und Gasaustausch prüfen'],
kh:['KH langsam anheben (max. ca. 1 dKH pro Tag)','Dosierung reduzieren, Teilwasserwechsel'],
ca:['Calcium nachdosieren, auf KH/Mg abstimmen','Dosierung pausieren'],
mg:['Magnesium nachdosieren (stabilisiert Ca/KH)','Dosierung pausieren'],
no3:['Zu wenig kann Korallen ausbleichen lassen – etwas mehr füttern','Wasserwechsel, weniger füttern, Abschäumer reinigen'],
po4:['Zu wenig kann Algen/Dinos fördern – Futtermenge prüfen','Phosphatentferner, Wasserwechsel, weniger füttern'],
no2:['','Filterbiologie prüfen, Wasserwechsel, vorerst nicht füttern'],nh4:['','Wasserwechsel, nicht füttern, Filterbiologie und Besatz prüfen']};
const SL=['Im Zielbereich','Leicht abweichend','Kritisch'];
const TECH=['Abschäumer','Strömungspumpe','Rücklaufpumpe','Beleuchtung','Heizer','Kühlung','Osmoseanlage','Dosierpumpe','Nachfüllautomat','Filter/Technikbecken','Sonstiges'];
const $=i=>document.getElementById(i),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),td=()=>iso(new Date());
const fd=d=>d?d.split('-').reverse().join('.'):'';
const st=(p,v)=>{if(v>=p.a&&v<=p.b)return 0;const t=(p.b-p.a)*.5;return v>=p.a-t&&v<=p.b+t?1:2};
const dl=k=>Math.round((new Date(k.l)-new Date(td()))/864e5)+k.d;
let S;try{S=JSON.parse(localStorage.getItem('mw'))}catch(x){}
S=S||{tank:{},tech:[],w:[],t:[],k:[
{id:1,n:'Wasserwechsel',d:14,l:td()},{id:2,n:'Wasserwerte testen',d:7,l:td()},{id:3,n:'Abschäumer reinigen',d:7,l:td()},
{id:4,n:'Frontscheibe reinigen',d:3,l:td()},{id:5,n:'Filtermaterial/Vlies wechseln',d:14,l:td()},
{id:6,n:'Strömungspumpen reinigen',d:30,l:td()},{id:7,n:'Osmosewasser-Vorrat prüfen',d:7,l:td()}],sel:'no3'};
let T='ov',C1=0,C2=0;
let ref=null,tm;
const dbSave=()=>{if(!ref)return;clearTimeout(tm);tm=setTimeout(()=>ref.set({s:JSON.stringify(S)}).catch(()=>{}),600)};
const save=()=>{try{localStorage.setItem('mw',JSON.stringify(S))}catch(x){}dbSave()};
const go=t=>{if(t){if(t!=T&&window.scrollTo)scrollTo(0,0);T=t}applyT();save();$('nav').innerHTML=[['ov','🏠','Start'],['w','🧪','Werte'],['t','🐠','Tiere'],['k','✅','Aufgaben'],['m','☰','Mehr']].map(([k,i,n])=>`<button class="${k==(['ov','w','t','k'].includes(T)?T:'m')?'on':''}" onclick="go('${k}')"><span style="font-size:20px">${i}</span>${n}</button>`).join('');$('m').innerHTML=tkSel()+V[T]()};
const sw=()=>[...S.w].sort((a,b)=>a.d==b.d?a.id-b.id:a.d<b.d?-1:1);
const chip=(p,v)=>{const s=st(p,v);return `<span class="chip c${s}">${SL[s]}</span>`};
const V={};
V.ov=()=>{const w=sw(),l=w[w.length-1],tk=S.tank,live=S.t.filter(x=>!x.x);
const fish=live.filter(x=>x.t=='Fisch').reduce((a,x)=>a+(+x.n||1),0),cor=live.filter(x=>x.t=='Koralle').length,inv=live.filter(x=>x.t=='Wirbellose').length;
const due=S.k.filter(k=>dl(k)<=0),bad=l?P.filter(p=>l[p.k]!=null&&st(p,l[p.k])>0):[];
return `<div class=card><h2>${e(tk.name||'Mein Becken')}</h2><div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0">${live.filter(x=>x.t=='Fisch').map(x=>known(x)?img(known(x),40):'').join('')}</div><p class=mu>${tk.v?tk.v+' Liter · ':''}${fish} Fische · ${cor} Korallen · ${inv} Wirbellose${tk.s?' · läuft seit '+fd(tk.s):''}</p></div>`+
coach()+warn()+extra()+(due.length?`<div class=card style="border-color:var(--er)"><h2>⏰ Fällig</h2>${due.map(k=>`<div class=row><span>${e(k.n)} <span class=mu>(${dl(k)<0?-dl(k)+' Tage überfällig':'heute'})</span></span><button class=s onclick="done(${k.id})">Erledigt</button></div>`).join('')}</div>`:'')+
`<div class=card><h2>Aktuelle Werte ${l?'<span class=mu>vom '+fd(l.d)+'</span>':''}</h2>${l?`<div class=g>${P.filter(p=>l[p.k]!=null).map(p=>`<div class=v style="border-color:var(--${['ok','wa','er'][st(p,l[p.k])]})"><div class=mu>${p.n}</div><b>${l[p.k]} ${p.u}</b></div>`).join('')}</div>`:'<p class=mu>Noch keine Messwerte. Unter „Wasserwerte“ eintragen.</p>'}</div>`+
(bad.length?`<div class=card><h2>Handlungsbedarf</h2>${bad.map(p=>{const v=l[p.k];return `<div class=row><div><b>${p.n}</b> ${v} ${p.u} ${chip(p,v)}<br><span class=mu>Soll ${p.a}–${p.b} ${p.u}. ${H[p.k][v<p.a?0:1]}</span></div></div>`}).join('')}</div>`:l?'<div class=card><h2>✅ Alle gemessenen Werte im Zielbereich</h2></div>':'');};
V.w=()=>{const w=sw(),sel=P.find(p=>p.k==S.sel);
const form=`<div class=card><h2>Messung eintragen</h2><p class=mu>${S.pro?'Profi-Modus: alle Werte.':'Nur die wichtigsten Werte. Du musst nicht alles messen.'} <a href="#" onclick="S.pro=!S.pro;go();return false" style="color:var(--ac)">${S.pro?'Weniger anzeigen':'Alle Werte anzeigen'}</a></p><div class=g><div><label>Datum</label><input type=date id=wd value="${td()}"></div>${P.filter(p=>S.pro||['temp','sal','ph','kh','no3','po4'].includes(p.k)).map(p=>`<div><label>${p.n} ${p.u}</label><input type=number inputmode=decimal step=${p.s} id=w_${p.k}></div>`).join('')}</div><label style="margin-top:8px">Notiz</label><input id=wn><button class=b onclick="addW()">Speichern</button></div>`;
if(!w.length)return form;
const rows=P.map(p=>{const v=w.filter(x=>x[p.k]!=null).map(x=>+x[p.k]);if(!v.length)return '';const c=v[v.length-1],pr=v[v.length-2],tr=pr==null?'–':c>pr?'↑':c<pr?'↓':'→';
return `<tr><td>${p.n}</td><td><b>${c}</b> ${p.u}</td><td>${p.a}–${p.b}</td><td>${chip(p,c)}</td><td>${tr}</td><td>${(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2)}</td><td>${Math.min(...v)}–${Math.max(...v)}</td><td>${Math.round(v.filter(x=>st(p,x)==0).length/v.length*100)} %</td></tr>`}).join('');
const o=w.map((x,i)=>`<option value=${i}>${fd(x.d)}</option>`).join('');
const a=w[C1]||w[0],b=w[C2]||w[w.length-1];
return form+`<div class=card><h2>Auswertung</h2><div class=t><table><tr><th>Wert<th>Aktuell<th>Soll<th>Status<th>Trend<th>Ø<th>Min–Max<th>Im Soll</tr>${rows}</table></div></div>
<div class=card><h2>Verlauf</h2><select onchange="S.sel=this.value;go()">${P.map(p=>`<option value=${p.k} ${p.k==S.sel?'selected':''}>${p.n}</option>`).join('')}</select> <select onchange="S.per=+this.value;go()">${[[0,'Alles'],[7,'7 Tage'],[30,'30 Tage'],[90,'90 Tage']].map(([v,n])=>`<option value=${v} ${(S.per||0)==v?'selected':''}>${n}</option>`).join('')}</select>${chart(sel,w)}</div>
<div class=card><h2>Messungen vergleichen</h2><div class=g><select onchange="C1=+this.value;go()">${o.replace(`value=${C1}>`,`value=${C1} selected>`)}</select><select onchange="C2=+this.value;go()">${o.replace(`value=${w.indexOf(b)}>`,`value=${w.indexOf(b)} selected>`)}</select></div>
<div class=t><table><tr><th>Wert<th>${fd(a.d)}<th>${fd(b.d)}<th>Differenz</tr>${P.filter(p=>a[p.k]!=null&&b[p.k]!=null).map(p=>`<tr><td>${p.n}<td class=x${st(p,a[p.k])}>${a[p.k]}<td class=x${st(p,b[p.k])}>${b[p.k]}<td>${(b[p.k]-a[p.k]>0?'+':'')+(b[p.k]-a[p.k]).toFixed(2)} ${p.u}</tr>`).join('')}</table></div></div>
<div class=card><h2>Alle Messungen</h2><div class=t><table><tr><th>Datum${P.filter(p=>w.some(x=>x[p.k]!=null)).map(p=>'<th>'+p.n).join('')}<th></tr>${[...w].reverse().map(x=>`<tr><td>${fd(x.d)}${P.filter(p=>w.some(y=>y[p.k]!=null)).map(p=>`<td class="${x[p.k]!=null?'x'+st(p,x[p.k]):''}">${x[p.k]??''}`).join('')}<td><button class=s onclick="del('w',${x.id})">✕</button></tr>`).join('')}</table></div></div>
<p class=mu>Richtwerte gelten für ein typisches Riffaquarium. Passe sie an dein Becken und deinen Besatz an.</p>`};
function chart(p,w){const d=w.filter(x=>x[p.k]!=null&&(!S.per||dd(x.d,td())<=S.per)).slice(-60);if(d.length<2)return '<p class=mu>Für den Verlauf werden mindestens zwei Messwerte benötigt.</p>';
const W=600,Hh=220,m=40,v=d.map(x=>+x[p.k]),lo=Math.min(p.a,...v),hi=Math.max(p.b,...v),pd=(hi-lo)*.15||1,y0=lo-pd,y1=hi+pd;
const X=i=>m+i*(W-m-12)/(d.length-1),Y=z=>Hh-26-(z-y0)/(y1-y0)*(Hh-40);
return `<svg viewBox="0 0 ${W} ${Hh}" width="100%"><rect x=${m} y=${Y(p.b)} width=${W-m-12} height=${Y(p.a)-Y(p.b)} fill="#1b9e5a" opacity=".15"/><text x=2 y=${Y(p.b)+4}>${p.b}</text><text x=2 y=${Y(p.a)+4}>${p.a}</text>
<polyline fill=none stroke="#0a7ea4" stroke-width=2 points="${v.map((z,i)=>X(i)+','+Y(z)).join(' ')}"/>${v.map((z,i)=>`<circle cx=${X(i)} cy=${Y(z)} r=4 fill="${['#1b9e5a','#d99a00','#d64545'][st(p,z)]}"><title>${fd(d[i].d)}: ${z} ${p.u}</title></circle>`).join('')}
<text x=${m} y=${Hh-6}>${fd(d[0].d)}</text><text x=${W-12} y=${Hh-6} text-anchor=end>${fd(d[d.length-1].d)}</text></svg><p class=mu>Grüner Bereich = Sollwert (${p.a}–${p.b} ${p.u})</p>`}
function addW(){const o={id:Date.now(),d:$('wd').value||td(),n:$('wn').value};P.forEach(p=>{const v=($('w_'+p.k)||{}).value;if(v!==''&&v!=null)o[p.k]=+v});
if(P.every(p=>o[p.k]==null)){alert('Bitte mindestens einen Wert eintragen.');return}S.w.push(o);C1=0;C2=S.w.length-1;go()}
V.t=()=>{const L=S.t,cost=L.reduce((a,x)=>a+(x.p||0)*(+x.c||1),0);return `<div class=card><h2>Tier hinzufügen</h2>${cost?'<p class=mu>Gesamtkosten Besatz: '+cost.toFixed(2)+' €</p>':''}<div class=g><div><label>Typ</label><select id=tt><option>Fisch<option>Koralle<option>Wirbellose</select></div><div><label>Name / Art</label><input id=tn list=fl placeholder="z. B. Clownfisch"><datalist id=fl>${FISH.map(f=>`<option value="${f[0]}">`).join('')}</datalist></div><div><label>Anzahl</label><input type=number id=tc value=1 min=1></div><div><label>Eingesetzt am</label><input type=date id=td value="${td()}"></div><div><label>Preis pro Tier (€)</label><input type=number step=.01 id=tp></div><div><label>Händler</label><input id=th></div><div><label>Geschlecht</label><select id=tg><option value="">–<option>♂<option>♀</select></div></div><label style="margin-top:8px">Herkunft / Notizen</label><input id=to><button class=b onclick="addT()">Hinzufügen</button></div>`+
['Fisch','Koralle','Wirbellose'].map(t=>{const l=L.filter(x=>x.t==t);return `<div class=card><h2>${{Fisch:'🐟 Fische',Koralle:'🪸 Korallen',Wirbellose:'🦐 Wirbellose'}[t]} (${l.filter(x=>!x.x).length})</h2>${l.length?l.map(x=>`<div class=row style="${x.x?'opacity:.55':''}"><div><b>${e(x.n)}</b> × ${x.c}<br><span class=mu>seit ${fd(x.d)}${x.g?' · '+x.g:''}${x.p?' · '+x.p+' €':''}${x.h?' · '+e(x.h):''}${x.x?' · verstorben '+fd(x.x):''}${x.o?' · '+e(x.o):''}</span></div><div><button class=s onclick="dead(${x.id})">${x.x?'↺':'†'}</button> <button class=s onclick="del('t',${x.id})">✕</button></div></div>`).join(''):'<p class=mu>Noch keine Einträge.</p>'}</div>`}).join('')};
function addT(){if(!$('tn').value.trim()){alert('Bitte einen Namen eintragen.');return}S.t.push({id:Date.now(),t:$('tt').value,n:$('tn').value.trim(),c:+$('tc').value||1,d:$('td').value,o:$('to').value,p:+$('tp').value||0,h:$('th').value,g:$('tg').value});go()}
function dead(id){const x=S.t.find(i=>i.id==id);x.x=x.x?null:td();go()}
V.b=()=>{const k=S.tank;const f=(id,l,t='text')=>`<div><label>${l}</label><input id=k_${id} type=${t} ${t=='number'?'step=any inputmode=decimal':''} value="${e(k[id])}" oninput="vcalc(event)"></div>`;
return `<div class=card><h2>Aquarium</h2><div class=g>${f('name','Name')}${f('v','Nettovolumen (Liter)','number')}${f('lg','Länge (cm)','number')}${f('br','Breite (cm)','number')}${f('h','Höhe (cm)','number')}${f('glas','Glasstärke (mm)','number')}${f('gap','Abstand Wasser bis Oberkante (cm)','number')}${f('einr','Gestein und Sand (% vom Volumen, z. B. 15)','number')}${f('sump','Technikbecken (Liter)','number')}${f('s','Gestartet am','date')}${f('salz','Salzmarke')}${f('album','Foto-Album (Link)')}</div><div id=vres style="margin-top:10px"></div>${(setTimeout(vcalc),'')}<button class=b onclick="saveK()">Speichern</button></div>
<div class=card><h2>Technik hinzufügen</h2><div class=g><div><label>Kategorie</label><select id=hc>${TECH.map(t=>`<option>${t}`).join('')}</select></div><div><label>Bezeichnung / Modell</label><input id=hn></div><div><label>Notiz (z. B. Leistung)</label><input id=ho></div></div><button class=b onclick="addH()">Hinzufügen</button></div>
<div class=card><h2>Technik</h2>${S.tech.length?S.tech.map(x=>`<div class=row><div><b>${x.c}</b>: ${e(x.n)}<br><span class=mu>${e(x.o)}</span></div><button class=s onclick="del('tech',${x.id})">✕</button></div>`).join(''):'<p class=mu>Noch keine Technik eingetragen.</p>'}</div>${TE()}`};
/* Dosier-Rechner: Erhöhung pro 1 g Reinsubstanz auf 100 Liter (aus der Chemie berechnet) */

['Fisch','Weißpünktchen (Cryptocaryon)','Weiße Pünktchen wie Salzkörner auf Haut und Flossen, Scheuern an Steinen, schnelle Atmung, Appetitlosigkeit.','Meist mit neuen Fischen eingeschleppt; Stress durch schlechte Wasserwerte oder Mobbing begünstigt den Ausbruch.','Alle Fische in ein Hospitalbecken setzen und dort mit einem zugelassenen Mittel behandeln, zum Beispiel Kupfer mit Testkit oder nach Anleitung abgesenktem Salzgehalt. Das Hauptbecken ohne Fische lassen (mehrere Wochen), weil sich die Parasiten im Becken vermehren. Kupfer und viele Mittel töten Korallen, Garnelen und Schnecken, deshalb nie im Riffbecken anwenden.',' Neue Fische 4 bis 6 Wochen in Quarantäne halten, Stress vermeiden, Wasserwerte stabil halten.',2],
['Fisch','Samtkrankheit (Amyloodinium/Oodinium)','Feiner gold- bis grauer Belag wie Puderzucker, eingeklemmte Flossen, sehr schnelle Atmung, Fische hängen an der Oberfläche.','Einzelliger Parasit, der sich schnell im Becken ausbreitet; oft nach Neuzugängen oder Stress.','Notfall: sofort ins Hospitalbecken und mit zugelassenem Mittel behandeln (etwa Kupfer oder ein Antiseptikum laut Packungsbeilage). Weil der Parasit Photosynthese betreibt, wird oft im Dunkeln behandelt. Ein vorhandener UV-Klärer muss während der Behandlung aus. Das Hauptbecken danach fischfrei stehen lassen.','Quarantäne für jeden Neuzugang, Becken sauber halten, Stress vermeiden.',2],
['Fisch','Brooklynellose','Graue bis weißliche Schleimschicht, Haut löst sich in Fetzen, Fische atmen schwer; häufig bei Clownfischen und Seepferdchen, sehr schnell tödlich.','Parasitische Einzeller (Brooklynella) aus dem Handel oder durch Stress.','Sofort handeln: kurzes Süßwasserbad (temperatur- und pH-angepasst, unter Aufsicht) kann erste Entlastung bringen, danach Hospitalbecken und Behandlung mit einem Mittel gegen Hauttrüber nach Packungsbeilage; Tierarzt oder Fachhandel einbinden.','Quarantäne, Fische vor dem Kauf auf Schleimbelag prüfen.',2],
['Fisch','Uronema (Hautparasit)','Hautabschürfungen, offene Stellen, Schleimabsonderung, rasche Verschlechterung; ähnelt Brooklynellose.','Einzeller, begünstigt durch Stress und schlechtes Wasser.','Hospitalbecken, Wasserwechsel, Behandlung nach tierärztlicher oder fachhändlerischer Beratung; Süßwasserbad kann Parasiten abtöten, aber nicht bei geschwächten Fischen ohne Rat.','Quarantäne und gute Wasserqualität.',2],
['Fisch','Hautwürmer / Kiemenwürmer (Flukes)','Fische kratzen sich, schnelle Kiemenbewegung, trübe Haut, Weißpünktchen fehlen.','Wurmparasiten (Monogenea), meist durch Neuzugänge.','Hospitalbecken und Behandlung mit einem Mittel gegen Hautwürmer (zum Beispiel Praziquantel-Bad nach Anleitung); kurzes Süßwasserbad kann helfen. Tierarzt fragen.','Quarantäne, Fische vor dem Einsetzen beobachten.',1],
['Fisch','Flossenfäule und Hautinfektionen (bakteriell)','Ausgefranste, rötliche oder zerfallende Flossen, rote Stellen oder Geschwüre auf der Haut.','Schlechte Wasserqualität, Verletzungen oder Stress; Bakterien nutzen die Schwäche aus.','Wasserwerte verbessern (Wasserwechsel), Fisch in Hospitalbecken, Antiseptikum oder Antibiotikum nur nach Beratung durch Tierarzt oder Fachhandel anwenden.','Sauberes Wasser, kein Mobbing, abwechslungsreiches Futter.',1],
['Fisch','Pilzbefall','Watteartiger weißer Belag auf Haut oder Flossen, Appetitlosigkeit.','Meist sekundär nach Verletzung oder bei geschwächten Fischen.','Wasserqualität verbessern, im Hospitalbecken mit Antiseptikum laut Packungsbeilage behandeln; Ursache der Schwächung suchen.','Verletzungen vermeiden, Wasserwerte stabil halten.',1],
['Fisch','Lymphocystis (Blumenkohlkrankheit)','Rauhe, helle Knoten an Haut und Flossen, meist ohne Verhaltensänderung.','Viren, oft bei Stress oder nach Verletzungen.','Meist heilt sie von selbst. Gutes Wasser, Stress vermeiden, vitaminreiches Futter; Antibiotika helfen nicht.','Stabile Haltung, wenig Stress.',0],
['Fisch','Lochkrankheit (HLLE) bei Doktorfischen','Löcher und Rillen im Kopfbereich, oft mit hellem Schleim.','Häufig Futter- oder Vitaminmangel, schlechte Wasserqualität; manchmal auch Strom im Wasser.','Pflanzliches Futter wie Algen anbieten, Vitamine zufüttern, Wasserwechsel, Technik auf Streustrom prüfen (Erdung) und Aktivkohle einsetzen.','Abwechslungsreich füttern, Wasserqualität hoch halten.',1],
['Fisch','Stress durch Ammoniak, Nitrit oder Temperatur','Fische hecheln, bleiben an der Oberfläche, scheuern, verstecken sich.','Schlechte Wasserwerte, Überbesatz, plötzliche Schwankungen.','Wasser testen, Teilwasserwechsel, Futter reduzieren, Belüftung erhöhen und Ursache beheben.','Einlaufphase beachten, nicht überbesetzen, Werte regelmäßig messen.',1],
['Plage','Glasrosen (Aiptasia)','Braune, durchsichtige Anemonen an Steinen und Rückwänden, vermehren sich schnell.','Wird mit Gestein oder Ablegern eingeschleppt; Nährstoffe fördern das Wachstum.','Gezielt mit Aiptasia-Mitteln oder Kalkwasserpaste spritzen, Berghia-Nacktschnecken oder Pinzettfisch einsetzen. Nicht herausreißen: Fragmente wachsen weiter. Pfefferminzgarnelen helfen oft, aber nicht zuverlässig.','Ableger und Gestein kontrollieren, Nährstoffe niedrig halten.',1],
['Plage','Majano-Anemonen','Kleine, bräunlich-rosa Scheibenanemonen mit Tentakeln, die Korallen stechen können.','Einschleppung mit Gestein oder Ablegern; Nährstoffe begünstigen das Wachstum.','Kalkwasserpaste oder passende Spezialmittel einsetzen, befallene Steine herausnehmen und außerhalb behandeln.','Ableger vorher kontrollieren, Nährstoffe niedrig halten.',1],
['Plage','Acropora-Strudelwürmer (AEFW)','Kleine braune Würmchen auf Acropora, Gewebeverlust, helle Eier an den Zweigen.','Meist über neue Acropora eingeschleppt, vermehren sich schnell.','Befallene Korallen dippen und das Becken mit einem Spezialmittel behandeln (Packungsbeilage beachten, UV aus). Als Fressfeinde nennt ein Hersteller bestimmte kleine Lippfische und die Drachenkopf-Seenadel, Cirrhilabrus-Arten helfen dagegen kaum.','Neue Acropora im Quarantänebecken dippen und beobachten.',2],
['Plage','Rote Planarien (Plattwürmer)','Kleine rote Würmchen auf Steinen, Glas und Schneckenhäusern; oft in Massen.','Gut gefüttertes Becken, hohe Nährstoffe.','Meist harmlos: absaugen, Nährstoffe senken, Futter reduzieren; bei Massenbefall Spezialmittel aus dem Fachhandel nach Anleitung.','Nicht überfüttern, regelmäßig absaugen.',0],
['Plage','Cyanobakterien (Schmieralgen)','Rote, grüne oder braune Schmierschicht auf Boden und Steinen, riecht muffig.','Zu wenig Strömung, Nährstoffungleichgewicht, viel organische Stoffe.','Absaugen, Strömung erhöhen, Teilwasserwechsel, Abschäumer reinigen und Futter reduzieren. Nur im Notfall spezielle Mittel nach Anleitung.','Strömung, Nährstoffe und Pflege im Griff behalten.',1],
['Plage','Dinoflagellaten (Dinos)','Braune Schleimfäden mit Bläschen auf Sand und Steinen, oft sehr hartnäckig.','Nährstoffarmut, instabile Werte oder zu viel Licht.','Absaugen, Werte stabilisieren (nicht zu stark aushungern), eventuell kurzzeitig verdunkeln, bei starkem Befall Fachrat einholen.','Nährstoffe in einem stabilen Rahmen halten.',2],
['Plage','Bryopsis','Federartige grüne Büschel auf Steinen und Ablegern, wachsen schnell.','Meist mit Steinen oder Ablegern eingeschleppt; Nährstoffe fördern das Wachstum.','Befallene Stücke entfernen oder außerhalb des Beckens behandeln, Nährstoffe senken, Fachmittel nur nach Anleitung und mit Vorsicht bei Wirbellosen.','Neue Ableger und Steine kontrollieren.',1],
['Plage','Blasenalgen (Valonia)','Grüne, perlenartige Blasen auf Steinen.','Hohe Nährstoffe, meist durch Einschleppung.','Blasen vorsichtig entfernen, ohne sie zu zerdrücken, damit keine Sporen frei werden; Smaragdkrabbe kann sie fressen. Nährstoffe niedrig halten.','Nährstoffe niedrig, Ableger prüfen.',0],
['Plage','Feuerwürmer (Borstenwürmer)','Rötliche oder grünliche Würmer mit Borsten, nachts sichtbar.','Mit Gestein eingeschleppt; meist nützliche Restevertilger.','Normalerweise nicht bekämpfen. Sehr große Tiere lassen sich mit einer Falle fangen. Beim Anfassen Handschuhe tragen.','Nur bei Massenbefall Futter reduzieren.',0],
['Plage','Röhrenschnecken (Vermetiden)','Schneckenröhren mit Schleimfäden, die Korallen reizen.','Mit Ablegern eingeschleppt, vermehren sich bei viel Futter.','Befallene Stellen mechanisch entfernen, Schleimfäden absaugen, Futter reduzieren; manche Lippfische fressen junge Tiere.','Ableger kontrollieren, weniger füttern.',1],
['Plage','Nacktschnecken auf Korallen','Weiße Eispiralen, Gewebeverlust an Montipora oder Zoanthus, kleine Schnecken auf der Koralle.','Meist an neuen Korallen eingeschleppt.','Koralle dippen, Schnecken und Eier absammeln und absaugen, Koralle im Quarantänebecken beobachten.','Neue Korallen kontrollieren und dippen.',1],
['Plage','Seesterne (Asterina)','Kleine, fünfstrahlige Seesterne, die sich stark vermehren.','Mit Gestein eingeschleppt, Futter im Überfluss.','Meist harmlos; bei Massenvermehrung einsammeln und Futtermenge senken.','Nicht überfüttern.',0],
['Plage','Hydren','Kleine, durchsichtige Polypen an Steinen und Korallen, die stechen.','Vermehren sich bei viel Futter.','Absaugen, befallene Korallen dippen, Futter reduzieren, notfalls nach Anleitung behandeln.','Futter reduzieren, Ableger prüfen.',1]
];
let XF='all',XQ='';
const XH=()=>{const q=XQ.trim().toLowerCase();return KR.filter(k=>(XF=='all'||k[0]==XF)&&(!q||(k[1]+k[2]+k[3]+k[4]).toLowerCase().includes(q))).map(k=>`<details class=card style="border-top-color:${['#1b9e5a','#d99a00','#d64545'][k[6]]}"><summary style="cursor:pointer"><b>${k[1]}</b> <span class="chip c${k[6]}">${['Meist harmlos','Behandeln','Dringend'][k[6]]}</span></summary><p><b>Erkennen:</b> ${k[2]}</p><p><b>Ursache:</b> ${k[3]}</p><p><b>Lösung:</b> ${k[4]}</p><p><b>Vorbeugen:</b> ${k[5]}</p></details>`).join('')||'<p class=mu>Nichts gefunden.</p>'};
let XG='all';
const XCAT={'Weißpünktchen (Cryptocaryon)':'Parasiten','Samtkrankheit (Amyloodinium/Oodinium)':'Parasiten','Brooklynellose':'Parasiten','Uronema (Hautparasit)':'Parasiten','Hautwürmer / Kiemenwürmer (Flukes)':'Parasiten','Flossenfäule und Hautinfektionen (bakteriell)':'Bakterien, Pilze & Viren','Pilzbefall':'Bakterien, Pilze & Viren','Lymphocystis (Blumenkohlkrankheit)':'Bakterien, Pilze & Viren','Lochkrankheit (HLLE) bei Doktorfischen':'Haltung & Stress','Stress durch Ammoniak, Nitrit oder Temperatur':'Haltung & Stress','Glasrosen (Aiptasia)':'Anemonen & Polypen','Majano-Anemonen':'Anemonen & Polypen','Hydren':'Anemonen & Polypen','Acropora-Strudelwürmer (AEFW)':'Würmer','Rote Planarien (Plattwürmer)':'Würmer','Feuerwürmer (Borstenwürmer)':'Würmer','Cyanobakterien (Schmieralgen)':'Algen & Beläge','Dinoflagellaten (Dinos)':'Algen & Beläge','Bryopsis':'Algen & Beläge','Blasenalgen (Valonia)':'Algen & Beläge','Röhrenschnecken (Vermetiden)':'Schnecken & Sonstige','Nacktschnecken auf Korallen':'Schnecken & Sonstige','Seesterne (Asterina)':'Schnecken & Sonstige'};
const XORD=['Parasiten','Bakterien, Pilze & Viren','Haltung & Stress','Anemonen & Polypen','Würmer','Algen & Beläge','Schnecken & Sonstige'];
const xd=k=>`<details class=card style="border-top-color:${['#1b9e5a','#d99a00','#d64545'][k[6]]}"><summary style="cursor:pointer"><b>${k[1]}</b> <span class="chip c${k[6]}">${['Meist harmlos','Behandeln','Dringend'][k[6]]}</span></summary><p><b>Erkennen:</b> ${k[2]}</p><p><b>Ursache:</b> ${k[3]}</p><p><b>Lösung:</b> ${k[4]}</p><p><b>Vorbeugen:</b> ${k[5]}</p></details>`;
const XH2=()=>{const q=XQ.trim().toLowerCase(),L=KR.filter(k=>(XF=='all'||k[0]==XF)&&(XG=='all'||XCAT[k[1]]==XG)&&(!q||(k[1]+k[2]+k[3]+k[4]).toLowerCase().includes(q)));
return XORD.map(c=>{const l=L.filter(k=>XCAT[k[1]]==c);return l.length?`<h2 style="margin:14px 4px 6px">${c} <span class=mu>(${l.length})</span></h2>`+l.map(xd).join(''):''}).join('')||'<p class=mu>Nichts gefunden.</p>'};
const xchips=()=>{const cs=XORD.filter(c=>XF=='all'||KR.some(k=>k[0]==XF&&XCAT[k[1]]==c));return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0">${[['all','Alle Kategorien'],...cs.map(c=>[c,c])].map(([k,n])=>`<button class="${XG==k?'b':'s'}" style="margin:0;padding:6px 10px;font-size:13px" onclick="XG='${k}';go()">${n}</button>`).join('')}</div>`};
function xres(){$('xl').innerHTML=XH2()}
V.x=()=>`<div class=card><h2>🩺 Krankheiten &amp; Plagen</h2><div class=g style="grid-template-columns:repeat(3,1fr)">${[['all','Alle'],['Fisch','Krankheiten'],['Plage','Plagen']].map(([k,n])=>`<button class="${XF==k?'b':'s'}" style="margin:0;padding:8px" onclick="XF='${k}';XG='all';go()">${n}</button>`).join('')}</div>${xchips()}<input type=search placeholder="Suchen …" value="${e(XQ)}" oninput="XQ=this.value;xres()" style="margin-top:8px"><p class=mu>Allgemeine Hinweise, keine Diagnose und keine tierärztliche Beratung. Mittel immer nach Packungsbeilage anwenden. Kupfer und viele Medikamente schaden Korallen, Garnelen und Schnecken, deshalb im Hospitalbecken behandeln.</p></div><div id=xl>${XH2()}</div>`;

function qk(){const k=S.k.find(x=>/wasserwechsel/i.test(x.n));if(k)done(k.id);else go('k')}
const start=()=>{const s=[[!!S.tank.v,'Becken eintragen','Größe und Technik','b'],[S.w.length>0,'Erste Messung eintragen','Wasserwerte festhalten','w'],[S.t.some(x=>!x.x),'Erstes Tier eintragen','Fische und Korallen','t']],n=s.filter(x=>x[0]).length;
return (n<3?`<div class=card><h2>👋 Erste Schritte (${n}/3)</h2>${s.map(x=>`<div class=row><span class="${x[0]?'x0':''}">${x[0]?'✔':'○'} <b>${x[1]}</b><br><span class=mu>${x[2]}</span></span>${x[0]?'':`<button class=s onclick="go('${x[3]}')">Los</button>`}</div>`).join('')}</div>`:'')+
`<div class=g style="grid-template-columns:repeat(2,1fr);margin-bottom:12px">${[['🧪','Messung eintragen',"go('w')"],['💧','Wasserwechsel erledigt',"qk()"],['🐟','Tier hinzufügen',"go('t')"],['🔍','Suchen',"go('s')"]].map(a=>`<button class=q onclick="${a[2]}"><span style="font-size:22px">${a[0]}</span><br>${a[1]}</button>`).join('')}</div>`};
const ov0=V.ov;V.ov=()=>start()+health()+trend()+ov0();

/* Salz-Auswahl: Marken + eigene Salze */
const SALZ=[['Anderes Salz (eigener Wert)',35,'r'],['Tropic Marin Pro-Reef',38,'h'],['Tropic Marin Classic',38,'r'],['Tropic Marin Bio-Actif',35,'r'],['Tropic Marin Syn-Biotic',35,'r'],['Aqua Medic Reef Salt',38,'h'],['Red Sea Coral Pro',35,'r'],['Red Sea Salt (Blue Bucket)',35,'r'],['Instant Ocean Sea Salt',35,'r'],['Instant Ocean Reef Crystals',35,'r'],['Seachem Reef Salt',35,'r'],['Aquaforest Reef Salt',35,'r'],['Zoo Med Reef Salt',35,'r']];
const sInfo=()=>{const v=S.sSel||'b:0',[k,i]=v.split(':');if(k=='c'){const c=(S.salz||[]).find(x=>x.id==i);if(c)return {n:c.n,g:c.g,t:'c',key:v}}
const key=k=='b'?v:'b:0',b=SALZ[+key.split(':')[1]]||SALZ[0],o=(S.sv||{})[key];return {n:b[0],g:o||b[1],t:o?'e':b[2],key}};
const sNote=si=>({h:'Herkunft: Herstellerangabe, etwa '+si.g+' g pro Liter für 35 ppt. Bitte mit deiner Packung abgleichen.',r:'Richtwert '+si.g+' g pro Liter für 35 ppt. Die Angabe auf deiner Packung kann abweichen, trage sie unten ein, dann merkt sich die App den Wert.',e:'Dein gespeicherter Wert für dieses Salz.',c:'Dein eigenes Salz.'})[si.t];
const saltCard=v=>{const si=sInfo(),cs=S.salz||[],n=(id,l,val)=>`<div><label>${l}</label><input id="r_${id}" type=number step=any inputmode=decimal value="${val}" oninput="calc()"></div>`;
return `<div class=card><h2>🧂 Salz ansetzen</h2><div class=g><div style="grid-column:1/-1"><label>Salzmarke</label><select id=r_salz onchange="saltSel()">${SALZ.map((b,i)=>`<option value="b:${i}" ${si.key=='b:'+i?'selected':''}>${b[0]}</option>`).join('')}${cs.length?`<optgroup label="Meine Salze">${cs.map(c=>`<option value="c:${c.id}" ${si.key=='c:'+c.id?'selected':''}>${e(c.n)}</option>`).join('')}</optgroup>`:''}</select></div>${n('sl','Wassermenge (L)',v?Math.round(v/10):'')}${n('ss','Ziel-Salinität (ppt)',35)}${n('sg','Salz pro Liter für 35 ppt (g)',si.g)}</div><p id=o_sn class=mu style="margin-top:8px">${sNote(si)}</p><p id=o_s></p>${si.key[0]=='c'?'<button class=s onclick="delSalz()">Dieses Salz löschen</button>':''}
<details style="margin-top:10px"><summary style="cursor:pointer">Eigenes Salz speichern</summary><div class=g style="margin-top:8px"><div><label>Name</label><input id=r_cn></div><div><label>Menge (g) pro Liter</label><input id=r_cg type=number step=any inputmode=decimal></div><div><label>für Salinität (ppt)</label><input id=r_cp type=number step=any inputmode=decimal value=35></div></div><button class=b onclick="addSalz()">Speichern</button></details>
<p class=mu>Üblich sind etwa 33 bis 40 g Salz pro Liter für 35 ppt, je nach Marke. Salz immer ins Wasser geben, nicht umgekehrt, und die Dichte nach dem Auflösen mit dem Refraktometer prüfen.</p></div>`};
function saltSel(){S.sSel=$('r_salz').value;const si=sInfo();$('r_sg').value=si.g;$('o_sn').innerHTML=sNote(si);save();go()}
function saltSave(sg){if(!(sg>0))return;const si=sInfo();if(sg==si.g)return;if(si.key[0]=='c'){const c=S.salz.find(x=>'c:'+x.id==si.key);if(c)c.g=sg}else(S.sv=S.sv||{})[si.key]=sg;save()}
function addSalz(){const n=$('r_cn').value.trim(),g=parseFloat($('r_cg').value),pp=parseFloat($('r_cp').value)||35;if(!n||!(g>0)){alert('Bitte Name und Menge pro Liter eintragen.');return}
const c={id:Date.now(),n,g:Math.round(g/pp*35*10)/10};(S.salz=S.salz||[]).push(c);S.sSel='c:'+c.id;go()}
function delSalz(){if(!confirm('Dieses Salz löschen?'))return;const k=(S.sSel||'').split(':')[1];S.salz=(S.salz||[]).filter(x=>x.id!=k);S.sSel='b:0';go()}

/* Gesundheit, Trend, Besatz-Check, Wartung, Strom, Plan, Urlaub, Lernpfad, Export */
let LF='all';
const lfc=()=>`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${[['all','Alle Fische'],['reef','Riffsicher'],['small','Bis 150 Liter']].map(([k,n])=>`<button class="${LF==k?'b':'s'}" style="margin:0;padding:6px 10px;font-size:13px" onclick="LF='${k}';go()">${n}</button>`).join('')}</div>`;
const health=()=>{const w=sw();if(!w.length)return '';const l=w[w.length-1];let sc=100;const why=[];
P.forEach(p=>{if(l[p.k]==null)return;const a=st(p,l[p.k]);if(a==1){sc-=6;why.push(p.n+' leicht abweichend')}if(a==2){sc-=15;why.push(p.n+' kritisch')}});
const od=S.k.filter(k=>dl(k)<-3);if(od.length){sc-=Math.min(15,od.length*5);why.push(od.length+' Aufgabe(n) überfällig')}
const age=dd(l.d,td());if(age>14){sc-=10;why.push('letzte Messung vor '+age+' Tagen')}
sc=Math.max(0,sc);const c=sc>=85?0:sc>=60?1:2;
